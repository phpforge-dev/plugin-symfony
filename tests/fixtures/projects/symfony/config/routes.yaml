controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

api_controllers:
    resource: ../src/Api/
    type: attribute
    prefix: /api/v1
    name_prefix: api_v1_

homepage:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
    methods: [GET]

when@dev:
    _errors:
        resource: '@FrameworkBundle/Resources/config/routing/errors.xml'
        prefix: /_error
    debug_page:
        path: /_debug
